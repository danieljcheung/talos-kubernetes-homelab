apiVersion: v1
kind: ConfigMap
metadata:
  name: local-business-prospector-config
  namespace: local-business-prospector
  labels:
    app.kubernetes.io/name: local-business-prospector
data:
  NODE_ENV: "production"
  HOST: "0.0.0.0"
  PORT: "8787"
  SITE_GENERATION_MODE: "omp"
  OMP_WORKER_URL: "http://local-business-prospector-omp-worker.local-business-prospector.svc.cluster.local:8788"
  SQLITE_DB_PATH: "/app/out/local-business-prospector.sqlite"
  SITES_OUT: "/app/out/sites"
  AUTH_MODE: "cloudflare-access"
  ALLOWED_ORIGINS: "https://prospector.danieljcheung.com"
  CREDENTIAL_ENTRY_MODE: "disabled"
  OMP_RPC_MODEL: "google-antigravity/gemini-3.6-flash-high"
  OMP_RPC_FALLBACK_MODEL: "gpt-5.4-mini"
  OMP_RPC_AUTO_APPROVE: "true"
  OMP_RPC_SKILLS: "design-taste-frontend"
  OMP_GENERATION_TIMEOUT_MS: "900000"
  CLOUDFLARE_R2_REGION: "auto"
  CLOUDFLARE_R2_PREFIX: "kept-sites"
  KEEP_SITE_MAX_ZIP_BYTES: "26214400"
