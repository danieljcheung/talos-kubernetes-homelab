apiVersion: v1
kind: Secret
metadata:
  name: local-business-prospector-dashboard-secret
  namespace: local-business-prospector
  labels:
    app.kubernetes.io/name: local-business-prospector
    app.kubernetes.io/component: dashboard
type: Opaque
stringData:
  OPERATOR_TOKEN: "change_me_to_a_high_entropy_token"
  OMP_WORKER_TOKEN: "change_me_to_a_high_entropy_token"
  GOOGLE_MAPS_API_KEY: "change_me_to_your_google_maps_api_key"
  GOOGLE_MAPS_BROWSER_API_KEY: "change_me_to_your_browser_maps_api_key_or_empty"
  GOOGLE_MAPS_MAP_ID: "change_me_to_your_google_maps_map_id_or_empty"
  CLOUDFLARE_R2_BUCKET: "local-business-prospector-kept-sites"
  CLOUDFLARE_R2_ACCESS_KEY_ID: "change_me_to_your_r2_access_key_id"
  CLOUDFLARE_R2_SECRET_ACCESS_KEY: "change_me_to_your_r2_secret_access_key"
  CLOUDFLARE_R2_ACCOUNT_ID: "change_me_to_your_cloudflare_account_id"
  CLOUDFLARE_R2_ENDPOINT: "https://change_me_to_your_cloudflare_account_id.r2.cloudflarestorage.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: local-business-prospector-omp-worker-secret
  namespace: local-business-prospector
  labels:
    app.kubernetes.io/name: local-business-prospector
    app.kubernetes.io/component: omp-worker
type: Opaque
stringData:
  OMP_WORKER_TOKEN: "change_me_to_the_same_omp_worker_token"
  OMP_RPC_MODEL: "google-antigravity/gemini-3.5-flash:high"
  OMP_RPC_FALLBACK_MODEL: "gpt-5.4-mini"
