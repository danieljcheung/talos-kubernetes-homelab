apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: homestead
  namespace: cozy-friends
  labels:
    app.kubernetes.io/name: homestead
    app.kubernetes.io/part-of: cozy-friends
    app.kubernetes.io/component: server
spec:
  serviceName: homestead-headless
  replicas: 1
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: homestead
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homestead
        app.kubernetes.io/part-of: cozy-friends
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: stage-homestead-pack
          image: busybox:1.36.1@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f
          imagePullPolicy: IfNotPresent
          command:
            - /hooks/pack-stager.sh
          env:
            - name: PACK_SHA256
              value: 38e90816b5eb6bd5a3b66096ad60d08bd9c8d69c00b4d27c6bc38f4233fd9e81
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: homestead-pack
              mountPath: /pack
              readOnly: true
            - name: backup-hooks
              mountPath: /hooks
              readOnly: true
      terminationGracePeriodSeconds: 240
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload.minecraft
                    operator: In
                    values:
                      - "true"
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minecraft
          image: itzg/minecraft-server:2026.8.0-java17@sha256:d080ed3ce21e8d5b96dca46c4bbb245783285cc24e1c8e503f56219f872a75b6
          imagePullPolicy: IfNotPresent
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            - name: rcon
              containerPort: 25575
              protocol: TCP
          envFrom:
            - configMapRef:
                name: homestead-config
          env:
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cozy-friends-secrets
                  key: rcon-password
          startupProbe:
            exec:
              command:
                - mc-health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - mc-health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - mc-health
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "2"
              memory: 10Gi
            limits:
              cpu: "4"
              memory: 12Gi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: homestead-pack
              mountPath: /pack
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: backup
          image: itzg/mc-backup:2026.8.0@sha256:554fcfc0825040556c7e04c83f17944f46611efc2ccd12c552e8ed0f561fb80d
          imagePullPolicy: IfNotPresent
          command:
            - /hooks/backup-scheduler.sh
          env:
            - name: SRC_DIR
              value: /data
            - name: BACKUP_METHOD
              value: restic
            - name: BACKUP_NAME
              value: cozy-friends
            - name: RCON_HOST
              value: 127.0.0.1
            - name: RCON_PORT
              value: "25575"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cozy-friends-secrets
                  key: rcon-password
            - name: CRON_SCHEDULE
              value: "0 3 * * *"
            - name: CRON_BACKUP_UID
              value: "1000"
            - name: PRUNE_RESTIC_RETENTION
              value: --keep-daily 7 --keep-weekly 4 --keep-monthly 3
            - name: RESTIC_HOST
              value: cozy-friends-server
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cozy-friends-secrets
                  key: restic-password
            - name: RESTIC_REPOSITORY
              valueFrom:
                secretKeyRef:
                  name: cozy-friends-secrets
                  key: restic-repository
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cozy-friends-secrets
                  key: s3-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cozy-friends-secrets
                  key: s3-secret-access-key
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: cozy-friends-secrets
                  key: s3-region
            - name: POST_BACKUP_SCRIPT_FILE
              value: /hooks/post-backup.sh
            - name: METRICS_DIR
              value: /metrics
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: metrics
              mountPath: /metrics
            - name: backup-hooks
              mountPath: /hooks
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: node-exporter
          image: prom/node-exporter:v1.11.1@sha256:fbd8062b4529e166e902bd62cd93de2f48b36d50af942620d419657265bc20b1
          imagePullPolicy: IfNotPresent
          args:
            - --collector.textfile
            - --collector.textfile.directory=/metrics
            - --web.listen-address=:9100
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: metrics
              mountPath: /metrics
              readOnly: true
      volumes:
        - name: homestead-pack
          persistentVolumeClaim:
            claimName: homestead-pack
        - name: backup-hooks
          configMap:
            name: homestead-backup-hooks
            defaultMode: 0555
        - name: metrics
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: homestead
          app.kubernetes.io/part-of: cozy-friends
          app.kubernetes.io/component: world
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/default: enabled
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 100Gi
