apiVersion: v1
kind: Service
metadata:
  name: homestead-backup-metrics
  namespace: cozy-friends
  labels:
    app.kubernetes.io/name: homestead
    app.kubernetes.io/part-of: cozy-friends
    app.kubernetes.io/component: backup-metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homestead
    app.kubernetes.io/component: server
  ports:
    - name: metrics
      protocol: TCP
      port: 9100
      targetPort: metrics
