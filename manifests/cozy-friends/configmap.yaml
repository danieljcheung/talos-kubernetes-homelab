apiVersion: v1
kind: ConfigMap
metadata:
  name: homestead-config
  namespace: cozy-friends
  labels:
    app.kubernetes.io/name: homestead
    app.kubernetes.io/part-of: cozy-friends
data:
  # Owner accepted the Minecraft EULA before launch.
  EULA: "TRUE"
  TYPE: FABRIC
  VERSION: "1.20.1"
  MEMORY: 8G
  ONLINE_MODE: "TRUE"
  ENABLE_WHITELIST: "TRUE"
  ENFORCE_WHITELIST: "TRUE"
  ENABLE_RCON: "TRUE"
  RCON_PORT: "25575"
  MAX_PLAYERS: "15"
  DIFFICULTY: normal
  MODE: survival
  VIEW_DISTANCE: "8"
  SIMULATION_DISTANCE: "6"
  MOTD: Cozy Friends Server | Homestead 1.3.7
  # pack-stager.sh verifies and unpacks the ZIP into /data before startup.
  # Avoid itzg's root-only generic-pack reapply on the official read-only modes.
  SKIP_GENERIC_PACK_UPDATE_CHECK: "true"
