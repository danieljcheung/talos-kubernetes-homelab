# Boundary only: this example intentionally contains no credential values.
# Copy it to cozy-friends.secret.yaml, add values in a local SOPS editor, and
# keep the populated file encrypted. The Kustomization intentionally excludes
# both this example and the encrypted Secret.
apiVersion: v1
kind: Secret
metadata:
  name: cozy-friends-secrets
  namespace: cozy-friends
type: Opaque
stringData: {}
# Required stringData keys:
#   rcon-password
#   whitelist-sync-token
#   restic-password
#   restic-repository
#   s3-access-key-id
#   s3-secret-access-key
#   s3-region
