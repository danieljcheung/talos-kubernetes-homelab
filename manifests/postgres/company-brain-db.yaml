apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: company-brain-db
  namespace: company-brain
spec:
  instances: 1

  storage:
    storageClass: longhorn
    size: 10Gi

  bootstrap:
    initdb:
      database: company_brain
      owner: company_brain_app
      secret:
        name: company-brain-db-user
