apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whisper
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/danieljcheung/talos-kubernetes-homelab.git
    targetRevision: HEAD
    path: manifests/whisper
  destination:
    server: https://kubernetes.default.svc
    namespace: whisper
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
