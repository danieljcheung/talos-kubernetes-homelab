apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apply-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/danieljcheung/talos-kubernetes-homelab.git
    targetRevision: HEAD
    path: manifests/apply-agent
  destination:
    server: https://kubernetes.default.svc
    namespace: apply-agent
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
