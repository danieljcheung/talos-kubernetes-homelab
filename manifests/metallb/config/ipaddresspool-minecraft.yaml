apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: minecraft-public
  namespace: metallb-system
spec:
  addresses:
    - 10.0.0.254/32
  autoAssign: false
  serviceAllocation:
    namespaces:
      - cozy-friends
    serviceSelectors:
      - matchLabels:
          app.kubernetes.io/name: homestead
