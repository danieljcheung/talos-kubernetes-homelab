apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-event-ledger-policy
  namespace: agent-event-ledger
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow all pods in the same namespace to communicate
    - from:
        - podSelector: {}
    # Allow Alloy/Prometheus scraping from the monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
