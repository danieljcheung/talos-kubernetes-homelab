apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-event-ledger
  namespace: agent-event-ledger
  labels:
    app.kubernetes.io/name: agent-event-ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-event-ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-event-ledger
    spec:
      imagePullSecrets:
        - name: ghcr-danieljcheung
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/danieljcheung/agent-event-ledger@sha256:fd5fa8fa7a035ee57cfa6d86ca40f6abbe7511deadee5405aae390f15a22019d
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-event-ledger-db-app
                  key: uri
          livenessProbe:
            httpGet:
              path: /healthz/liveness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            readOnlyRootFilesystem: true
