apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshot
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn-recurring-jobs
    app.kubernetes.io/part-of: cozy-friends
spec:
  cron: "0 3 * * *"
  task: snapshot
  groups:
    - default
  retain: 7
  concurrency: 1
  labels:
    type: daily
    scope: homelab
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-backup
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn-recurring-jobs
    app.kubernetes.io/part-of: cozy-friends
spec:
  cron: "0 4 * * 0"
  task: backup
  groups:
    - default
  retain: 4
  concurrency: 1
  labels:
    type: weekly
    scope: homelab
