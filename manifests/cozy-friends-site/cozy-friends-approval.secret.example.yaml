# Boundary only: this example intentionally contains no credential values.
# Copy it to cozy-friends-approval.secret.yaml, add values in a local SOPS
# editor, and keep the populated file encrypted. Kustomize excludes examples
# and encrypted Secrets; apply the encrypted Secret through the local SOPS flow.
apiVersion: v1
kind: Secret
metadata:
  name: cozy-friends-approval-secrets
  namespace: cozy-friends-site
type: Opaque
stringData: {}
# Required stringData keys:
#   admin-token
#   sync-token
#   turnstile-secret-key
