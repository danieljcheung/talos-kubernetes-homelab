apiVersion: apps/v1
kind: Deployment
metadata:
  name: cozy-friends-approval-api
  namespace: cozy-friends-site
  labels:
    app.kubernetes.io/name: cozy-friends-approval-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cozy-friends
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cozy-friends-approval-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cozy-friends-approval-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: cozy-friends
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-danieljcheung
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: approval-api
          image: ghcr.io/danieljcheung/cozy-friends-approval-api@sha256:c958e1af08dfa6cd933be882e233a3aaf1be72851f2b495211e0c903ea5832b5
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cozy-friends-approval-db-app
                  key: uri
            - name: APPROVAL_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cozy-friends-approval-secrets
                  key: admin-token
            - name: APPROVAL_SYNC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cozy-friends-approval-secrets
                  key: sync-token
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cozy-friends-approval-secrets
                  key: turnstile-secret-key
            - name: TURNSTILE_EXPECTED_HOSTNAME
              value: cozy.popinvites.com
            - name: MINECRAFT_STATUS_HOST
              value: homestead-headless.cozy-friends.svc.cluster.local
            - name: MINECRAFT_STATUS_PORT
              value: "25565"
            - name: MINECRAFT_STATUS_TIMEOUT
              value: "2"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
