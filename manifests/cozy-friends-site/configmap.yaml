etween;gap:4px}.site-nav__link{min-height:36px;font-size:.6rem}.wordmark__name{font-size:1.4rem}.hero-copy{width:calc(100% - 24px);margin:-40px 12px 12px;padding:24px 20px}.hero-copy h1{font-size:clamp(2.35rem,12vw,3.35rem)}.hero-copy__about{margin-top:25px}.hero-actions{flex-direction:column;align-items:stretch}.hero-primary,.hero-secondary{width:100%}.countdown-band__inner{padding:22px 20px}.countdown-meta{gap:15px}.countdown-meta__body{font-size:.74rem}.launch-countdown__units{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:22px}.username-form{padding:20px}.username-form__fields{grid-template-columns:1fr}.username-form__row{align-items:stretch;flex-direction:column}.username-form .copy-button,.admin-token-form .copy-button{width:100%;flex-basis:48px}}@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}.admin-page{min-height:100vh;padding-top:clamp(36px,7vw,76px);padding-bottom:clamp(64px,10vw,120px)}.admin-page__wordmark{margin-bottom:clamp(42px,7vw,76px)}.admin-page h1{max-width:760px;font-size:clamp(2.4rem,6vw,4.7rem);line-height:1}.admin-page__intro{max-width:62ch;margin-top:20px;color:var(--moss);font-size:1.05rem;line-height:1.6}.admin-token-form{max-width:720px;margin-top:38px;padding-top:20px;border-top:1px solid var(--rule)}.admin-token-form .username-form__row{margin-top:12px}.admin-token-form+.username-form__status{margin-top:18px}.admin-requests{margin-top:clamp(48px,8vw,88px);padding-top:22px;border-top:1px solid var(--rule)}.admin-requests__header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:16px;border-bottom:1px solid var(--rule)}.admin-requests h2{color:var(--dark-moss);font-size:clamp(1.8rem,3.5vw,2.7rem);line-height:1.1}.admin-empty{padding:22px 0;color:var(--moss);line-height:1.6}.admin-table-wrap{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}.admin-table{width:100%;min-width:680px;border-collapse:collapse;color:var(--ink);font-size:.92rem;line-height:1.45;text-align:left}.admin-table th,.admin-table td{padding:16px 12px;border-bottom:1px solid var(--soft-rule);vertical-align:top}.admin-table thead th{padding-top:18px;padding-bottom:10px;color:var(--moss);font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.admin-table tbody th{color:var(--dark-moss);font-weight:700}.admin-table code{font-family:SFMono-Regular,Consolas,Liberation Mono,monospace;font-size:.95em;overflow-wrap:anywhere}.admin-table__actions{display:flex;justify-content:flex-end;gap:8px;min-width:190px;flex-wrap:wrap}.admin-status{display:inline-block;padding:4px 8px;border-left:3px solid var(--moss);color:var(--dark-moss);font-size:.74rem;font-weight:800;letter-spacing:.08em;line-height:1.25;text-transform:uppercase}.admin-status--pending{border-left-color:var(--wheat);background:#d9a4412e}.admin-status--approved{border-left-color:var(--moss);background:#58734e29}.admin-status--rejected{border-left-color:var(--clay);background:#b85c3f1f}.text-button{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:9px 12px;border:1px solid var(--dark-moss);border-radius:4px;background:transparent;color:var(--dark-moss);font-size:.82rem;font-weight:800;line-height:1.2;transition:background-color .16s ease,border-color .16s ease,color .16s ease,transform .16s ease}.text-button:hover{background:var(--wheat)}.text-button:active{transform:translateY(1px)}.text-button--approve{border-color:var(--moss)}.text-button--reject{border-color:var(--clay);color:var(--clay)}.text-button--reject:hover{border-color:var(--clay);background:var(--clay);color:var(--parchment)}@media (max-width: 500px){.admin-page{padding-top:28px}.admin-page__wordmark{margin-bottom:42px}.admin-requests__header{align-items:flex-start}.admin-table-wrap{margin-inline:-2px}