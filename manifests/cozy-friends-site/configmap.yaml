apiVersion: v1
kind: ConfigMap
metadata:
  name: cozy-friends-site
  labels:
    app.kubernetes.io/name: cozy-friends-site
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: cozy-friends
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="A field guide for joining the Cozy Friends Homestead 1.3.7 Minecraft server." />
        <meta name="theme-color" content="#f4edda" />
        <title>Cozy Friends Server | Homestead 1.3.7</title>
        <script type="module" crossorigin src="/assets/app.js?v=ba6a029"></script>
        <link rel="stylesheet" crossorigin href="/assets/app.css?v=ba6a029">
      </head>
      <body>
        <div id="root"></div>
      </body>
    </html>
