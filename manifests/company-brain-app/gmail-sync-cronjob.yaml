apiVersion: batch/v1
kind: CronJob
metadata:
  name: company-brain-gmail-sync
  labels:
    app.kubernetes.io/name: company-brain-app
    app.kubernetes.io/component: gmail-sync
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: company-brain-app
            app.kubernetes.io/component: gmail-sync
        spec:
          restartPolicy: Never
          containers:
            - name: trigger-background-sync
              image: curlimages/curl:8.11.1
              imagePullPolicy: IfNotPresent
              env:
                - name: COMPANY_BRAIN_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: company-brain-app-secrets
                      key: COMPANY_BRAIN_API_TOKEN
              args:
                - --fail
                - --show-error
                - --silent
                - --request
                - POST
                - --header
                - "Authorization: Bearer $(COMPANY_BRAIN_API_TOKEN)"
                - http://company-brain-app.company-brain.svc.cluster.local:3000/api/inbox/sync/gmail/background
