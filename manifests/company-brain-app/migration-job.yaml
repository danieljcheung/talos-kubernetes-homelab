apiVersion: batch/v1
kind: Job
metadata:
  name: company-brain-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/danieljcheung/company-brain:latest
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "prisma:migrate:deploy"]
          envFrom:
            - configMapRef:
                name: company-brain-app-config
            - secretRef:
                name: company-brain-app-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: company-brain-app-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
