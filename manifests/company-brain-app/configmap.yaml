apiVersion: v1
kind: ConfigMap
metadata:
  name: company-brain-app-config
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  LOCAL_INGESTION_ONLY: "false"
  ALLOW_AUTONOMOUS_ACTIONS: "false"
  ALLOW_EXTERNAL_WRITES: "true"
  GMAIL_SYNC_MAX_THREADS: "25"
  COMPANY_BRAIN_MAX_INBOX_ATTACHMENT_BYTES: "10485760"
