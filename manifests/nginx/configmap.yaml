apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-landing-page
  labels:
    app: nginx
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Daniel's Talos Kubernetes Homelab</title>
      <style>
        :root {
          --bg: #0b1220;
          --bg-accent: #111b31;
          --panel: rgba(15, 23, 42, 0.78);
          --panel-border: rgba(148, 163, 184, 0.18);
          --text: #e2e8f0;
          --muted: #94a3b8;
          --accent: #38bdf8;
          --accent-soft: rgba(56, 189, 248, 0.14);
          --success: #22c55e;
          --shadow: 0 24px 80px rgba(2, 8, 23, 0.45);
        }

        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          min-height: 100vh;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          color: var(--text);
          background:
            radial-gradient(circle at top left, rgba(56, 189, 248, 0.16), transparent 34%),
            radial-gradient(circle at right, rgba(34, 197, 94, 0.12), transparent 28%),
            linear-gradient(160deg, var(--bg) 0%, var(--bg-accent) 100%);
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 32px 20px;
        }

        .shell {
          width: min(960px, 100%);
          background: var(--panel);
          border: 1px solid var(--panel-border);
          border-radius: 24px;
          box-shadow: var(--shadow);
          backdrop-filter: blur(10px);
          overflow: hidden;
        }

        .topbar {
          display: flex;
          gap: 8px;
          padding: 18px 22px 0;
        }

        .dot {
          width: 11px;
          height: 11px;
          border-radius: 50%;
          background: rgba(226, 232, 240, 0.24);
        }

        .content {
          display: grid;
          gap: 28px;
          padding: 28px;
        }

        .eyebrow {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 8px 12px;
          border-radius: 999px;
          background: var(--accent-soft);
          color: var(--accent);
          font-size: 0.85rem;
          font-weight: 600;
          letter-spacing: 0.02em;
        }

        .status-dot {
          width: 9px;
          height: 9px;
          border-radius: 50%;
          background: var(--success);
          box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.12);
        }

        h1 {
          margin: 0;
          font-size: clamp(2.2rem, 5vw, 4.4rem);
          line-height: 0.96;
          letter-spacing: -0.04em;
        }

        p {
          margin: 0;
          color: var(--muted);
          font-size: 1.02rem;
          line-height: 1.7;
        }

        .lead {
          max-width: 64ch;
          font-size: 1.08rem;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          gap: 16px;
        }

        .card {
          padding: 18px;
          border-radius: 18px;
          background: rgba(15, 23, 42, 0.64);
          border: 1px solid rgba(148, 163, 184, 0.12);
        }

        .card h2 {
          margin: 0 0 10px;
          font-size: 0.95rem;
          color: #f8fafc;
          letter-spacing: 0.01em;
        }

        .stack {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
        }

        .pill {
          padding: 9px 12px;
          border-radius: 999px;
          background: rgba(30, 41, 59, 0.9);
          border: 1px solid rgba(148, 163, 184, 0.16);
          color: #cbd5e1;
          font-size: 0.92rem;
        }

        .flow {
          font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
          color: #7dd3fc;
          font-size: 0.96rem;
          line-height: 1.8;
          word-break: break-word;
        }

        ul {
          margin: 0;
          padding-left: 18px;
          color: var(--muted);
          line-height: 1.9;
        }

        .footer {
          display: flex;
          flex-wrap: wrap;
          justify-content: space-between;
          gap: 12px;
          padding-top: 6px;
          color: #cbd5e1;
          font-size: 0.95rem;
        }

        .footer span:last-child {
          color: var(--muted);
        }

        @media (max-width: 640px) {
          .content {
            padding: 22px;
          }
        }
      </style>
    </head>
    <body>
      <main class="shell">
        <div class="topbar" aria-hidden="true">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <section class="content">
          <div class="eyebrow">
            <span class="status-dot"></span>
            Live homelab status
          </div>

          <div>
            <h1>Daniel's Talos Kubernetes Homelab</h1>
            <p class="lead">
              A public resume and learning environment running on a bare-metal Intel i5 mini PC,
              built to demonstrate practical infrastructure work across Talos Linux, Kubernetes,
              and Argo CD GitOps.
            </p>
          </div>

          <div class="grid">
            <article class="card">
              <h2>Platform</h2>
              <div class="stack">
                <span class="pill">Bare-metal Intel i5 mini PC</span>
                <span class="pill">Talos Linux</span>
                <span class="pill">Kubernetes</span>
                <span class="pill">Argo CD GitOps</span>
              </div>
            </article>

            <article class="card">
              <h2>Current Delivery Path</h2>
              <div class="flow">GitHub -&gt; Argo CD -&gt; Kubernetes</div>
              <p>
                This landing page is deployed from the repository manifest set and kept in sync by
                the cluster's GitOps workflow.
              </p>
            </article>
          </div>

          <div class="grid">
            <article class="card">
              <h2>Why this exists</h2>
              <p>
                The homelab serves as an iterative platform for hands-on infrastructure practice,
                documentation, and visible deployment proof for future platform engineering work.
              </p>
            </article>

            <article class="card">
              <h2>Next Milestones</h2>
              <ul>
                <li>Tailscale connectivity</li>
                <li>Cluster monitoring</li>
                <li>Ingress and routing</li>
                <li>Security-focused workloads</li>
              </ul>
            </article>
          </div>

          <div class="footer">
            <span>Operational focus: lightweight, declarative, resume-friendly infrastructure.</span>
            <span>Managed from <code>manifests/nginx</code></span>
          </div>
        </section>
      </main>
    </body>
    </html>
