apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-landing-page
  labels:
    app: nginx
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Daniel Cheung</title>
        <link rel="stylesheet" href="styles.css" />
      </head>
      <body>
        <main class="note" aria-label="Personal note">
          <h1>Daniel Cheung</h1>
          <p>
            CS student building practical systems across AI, cloud, and infrastructure.<br />
            <span class="meta">Toronto, ON · Western University · <a href="https://github.com/danieljcheung" target="_blank" rel="noreferrer">github.com/danieljcheung</a></span>
          </p>

          <hr />

          <h2>now</h2>
          <p>Building a Talos Kubernetes homelab and Kin while pursuing internship/co-op roles focused on practical AI, cloud, and infrastructure systems.</p>

          <h2>projects</h2>
          <ul>
            <li><a href="#" class="project-link" aria-label="Talos Kubernetes Homelab" data-preview-meta="Talos · Kubernetes · Argo CD · Tailscale">[[Talos Kubernetes Homelab]]</a> — bare-metal Kubernetes with Talos, Argo CD, Tailscale, and GitOps.</li>
            <li><a href="#" class="project-link" aria-label="Kin" data-preview-meta="TypeScript · Next.js · AWS · Prisma · Postgres">[[Kin]]</a> — family assistant powered by OpenClaw, hosted on AWS, that helps households coordinate schedules, reminders, tasks, and shared context through natural conversation.</li>
            <li><a href="#" class="project-link" aria-label="Squish" data-preview-meta="Expo · React Native · TypeScript · Supabase">[[Squish]]</a> — mobile app for creating personalized AI agents through conversational onboarding.</li>
            <li><a href="#" class="project-link" aria-label="Tidy" data-preview-meta="Swift · SwiftUI · PhotoKit">[[Tidy]]</a> — privacy-first iOS camera roll cleaner; offline, no analytics.</li>
            <li><a href="#" class="project-link" aria-label="TRACE" data-preview-meta="Python · FastAPI · JavaScript · OSINT">[[TRACE]]</a> — OSINT self-assessment tool for mapping digital exposure from an email.</li>
          </ul>

          <h2>certifications</h2>
          <ul>
            <li><a href="https://www.credly.com/badges/e7405b8a-539b-41c0-af64-8bef0f9b8d7a/public_url" target="_blank" rel="noreferrer" aria-label="AWS Certified Cloud Practitioner">[[AWS Certified Cloud Practitioner]]</a></li>
          </ul>

          <h2>contact</h2>
          <p>
            <a href="https://github.com/danieljcheung" target="_blank" rel="noreferrer">GitHub</a> ·
            <a href="#" aria-label="LinkedIn">LinkedIn</a> ·
            <a href="mailto:danieljcheung@proton.me">Email</a>
          </p>
        </main>
      </body>
    </html>
  styles.css: |
    :root {
      --bg: #f7f8fc;
      --text: #1d2130;
      --muted: #58607a;
      --line: #d7dced;
      --accent: #5666b3;
      --accent-soft: #7a69b1;
      --font-body: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      --font-mono: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 1px 1px, rgba(76, 89, 140, 0.12) 1px, transparent 0),
        linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(240, 243, 252, 0.6));
      background-size: 16px 16px, 100% 100%;
      font-family: var(--font-body);
      line-height: 1.45;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-kerning: normal;
      font-feature-settings: "liga" 1, "kern" 1, "onum" 1;
    }

    .note {
      width: min(760px, 100% - 2rem);
      margin: 1.25rem auto;
      padding: 0.9rem 0 1.1rem;
    }

    h1,
    h2,
    p,
    ul {
      margin: 0;
    }

    h1 {
      font-size: clamp(1.35rem, 3.5vw, 1.6rem);
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    h2 {
      margin-top: 0.7rem;
      margin-bottom: 0.15rem;
      font-size: 0.98rem;
      font-weight: 640;
      color: var(--accent-soft);
    }

    p,
    li {
      font-size: 0.95rem;
    }

    p + h2,
    ul + h2 {
      margin-top: 0.85rem;
    }

    .meta {
      color: var(--muted);
      font-size: 0.9rem;
      font-family: var(--font-mono);
      letter-spacing: -0.01em;
    }

    hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 0.55rem 0 0.65rem;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 0.1rem;
    }

    li {
      margin: 0.12rem 0;
      padding-left: 0.05rem;
    }

    a {
      font-family: var(--font-mono);
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(86, 102, 179, 0.38);
    }

    a:hover,
    a:focus-visible {
      color: #3f4e98;
      border-bottom-color: rgba(63, 78, 152, 0.75);
      outline: none;
    }

    .project-link {
      position: relative;
    }

    .project-link::before {
      position: absolute;
      left: calc(100% + 0.6rem);
      opacity: 0;
      pointer-events: none;
      transform: translateY(0.12rem);
      transition: opacity 130ms ease, transform 130ms ease;
      z-index: 12;
    }

    .project-link::before {
      content: attr(data-preview-meta);
      top: -0.15rem;
      width: 19rem;
      max-width: min(19rem, 66vw);
      padding: 0.33rem 0.45rem 0.38rem;
      border: 1px solid rgba(125, 137, 186, 0.28);
      border-radius: 0.32rem;
      background: rgba(249, 251, 255, 0.98);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.73rem;
      letter-spacing: -0.01em;
      line-height: 1.22;
      box-shadow: 0 2px 10px rgba(29, 33, 48, 0.07);
    }

    .project-link:hover::before,
    .project-link:focus-visible::before {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 520px) {
      .note {
        width: min(760px, 100% - 1.2rem);
        margin-top: 0.9rem;
        padding-top: 0.65rem;
      }

      p,
      li {
        font-size: 0.92rem;
      }

      .meta {
        font-size: 0.86rem;
      }

      .project-link::before {
        left: 0;
        max-width: min(19rem, 84vw);
      }

      .project-link::before {
        top: 1.12rem;
        border-radius: 0.32rem;
      }
    }
